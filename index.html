<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conscious of Consciousness | Telemetry Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #050505; color: #0d9488; font-family: 'Montserrat', sans-serif; overflow: hidden; margin: 0; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        #ui { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(15, 23, 42, 0.92); padding: 22px; border: 1px solid #0d9488; border-radius: 16px; width: 440px; box-shadow: 0 0 25px rgba(13, 148, 136, 0.25); backdrop-filter: blur(10px); }
        input { width: 100%; padding: 12px; margin-bottom: 12px; background: #020617; border: 1px solid #334155; color: #38bdf8; border-radius: 8px; box-sizing: border-box; font-family: 'Montserrat', sans-serif; font-size: 14px; outline: none;}
        input:focus { border-color: #0d9488; box-shadow: 0 0 10px rgba(13, 148, 136, 0.3); }
        button { width: 100%; padding: 12px; background: #0d9488; color: #ffffff; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-family: 'Montserrat', sans-serif; letter-spacing: 1px; text-transform: uppercase; font-size: 13px; transition: background 0.3s;}
        button:hover { background: #0f766e; }
        
        /* Telemetry & UI Panels */
        .telemetry-panel { margin-top: 15px; background: #020617; padding: 12px; border-radius: 8px; border: 1px solid #1e293b; font-size: 12px; }
        .meter-container { background: #1e293b; border-radius: 4px; height: 8px; width: 100%; margin-top: 6px; overflow: hidden; }
        .meter-fill { height: 100%; width: 0%; background: #0d9488; transition: width 0.5s ease, background-color 0.5s ease; }
        .path-trail { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-family: monospace; font-size: 11px; color: #38bdf8; flex-wrap: wrap; }
        .node-tag { background: #0f172a; padding: 3px 8px; border: 1px solid #334155; border-radius: 4px; }
        
        h2 { font-family: 'Cormorant Garamond', serif; margin: 0 0 2px 0; font-size: 22px; color: #f8fafc; letter-spacing: 1px; }
        .subtitle { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: #94a3b8; margin-bottom: 14px; }
    </style>
</head>
<body>

    <div id="ui">
        <h2>Conscious of Consciousness</h2>
        <div class="subtitle">Neuro-Symbolic Live Telemetry</div>
        <input type="text" id="queryInput" placeholder="Enter concept (e.g., Advaita, Maya)..." onkeydown="if(event.key === 'Enter') sendQuery()">
        <button onclick="sendQuery()">Extract Structural Friction</button>
        
        <!-- NEW UI/UX: Structural Friction Meter -->
        <div class="telemetry-panel">
            <div style="display: flex; justify-content: space-between; color: #94a3b8; font-weight: 600;">
                <span>EPISTEMIC DEBT / FRICTION</span>
                <span id="debtValue">0.00</span>
            </div>
            <div class="meter-container">
                <div id="debtMeter" class="meter-fill"></div>
            </div>
        </div>

        <!-- NEW UI/UX: Graph Path Visualizer -->
        <div class="telemetry-panel">
            <div style="color: #94a3b8; font-weight: 600; margin-bottom: 4px;">ACTIVE GRAPH PATH</div>
            <div id="pathTrail" class="path-trail">
                <span style="color: #64748b;">Awaiting graph traversal...</span>
            </div>
        </div>
    </div>

    <!-- Three.js 3D Library -->
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script>
        // 1. SCENE SETUP
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        camera.position.z = 25;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0xd97706, 2, 50);
        pointLight.position.set(10, 10, 15);
        scene.add(pointLight);

        // 2. PROCEDURAL 3D LOGO ASSEMBLY
        const logoGroup = new THREE.Group();
        const tealMaterial = new THREE.MeshStandardMaterial({ color: 0x0d9488, roughness: 0.3, metalness: 0.2 });
        const goldMaterial = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.2, metalness: 0.5 });
        const wireMaterial = new THREE.MeshBasicMaterial({ color: 0x0d9488, wireframe: true, transparent: true, opacity: 0.3 });

        const ringGeo1 = new THREE.TorusGeometry(8, 0.08, 16, 100);
        logoGroup.add(new THREE.Mesh(ringGeo1, wireMaterial));
        const ringGeo2 = new THREE.TorusGeometry(6.5, 0.15, 16, 100);
        logoGroup.add(new THREE.Mesh(ringGeo2, tealMaterial));

        function createPetalShape(width, height) {
            const shape = new THREE.Shape();
            shape.moveTo(0, -height);
            shape.bezierCurveTo(width, -height, width * 1.2, 0, 0, height);
            shape.bezierCurveTo(-width * 1.2, 0, -width, -height, 0, -height);
            return shape;
        }

        const extrudeSettings = { depth: 0.6, bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: 0.1, bevelThickness: 0.1 };
        logoGroup.add(new THREE.Mesh(new THREE.ExtrudeGeometry(createPetalShape(3.5, 5.5), extrudeSettings), tealMaterial));
        
        const innerPetal = new THREE.Mesh(new THREE.ExtrudeGeometry(createPetalShape(2.2, 3.8), extrudeSettings), goldMaterial);
        innerPetal.position.z = 0;
        logoGroup.add(innerPetal);

        const coreMesh = new THREE.Mesh(new THREE.SphereGeometry(0.8, 32, 32), goldMaterial);
        coreMesh.position.set(0, 0.3, 0.4);
        logoGroup.add(coreMesh);

        scene.add(logoGroup);
        logoGroup.position.x = 4;

        // 3. ANIMATION & PHYSICS
        let currentSpin = 0.005;
        let targetSpin = 0.005;
        let targetDistortion = 0;
        let targetColor = new THREE.Color(0x0d9488);
        let isThinking = false;

        function animate() {
            requestAnimationFrame(animate);
            currentSpin += (targetSpin - currentSpin) * 0.05;
            logoGroup.rotation.y += currentSpin;
            logoGroup.rotation.x = Math.sin(Date.now() * 0.001) * 0.1;

            if (isThinking) {
                logoGroup.scale.setScalar(1 + Math.sin(Date.now() * 0.015) * 0.15);
            } else {
                const time = Date.now() * 0.004;
                logoGroup.scale.x = 1 + Math.sin(time) * (targetDistortion * 0.5);
                logoGroup.scale.y = 1 + Math.cos(time * 1.3) * (targetDistortion * 0.5);
                logoGroup.scale.z = 1 + Math.sin(time * 0.9) * (targetDistortion * 0.5);
            }

            tealMaterial.color.lerp(targetColor, 0.05);
            renderer.render(scene, camera);
        }
        animate();

        // 4. QUERY EXECUTION & UI UPDATES
        async function sendQuery() {
            const input = document.getElementById('queryInput').value;
            if (!input) return;

            isThinking = true;
            targetSpin = 0.04;
            targetColor.setHex(0xd97706);

            try {
                const response = await fetch("https://writers-dictionaries-tanks-protest.trycloudflare.com/extract", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ user_query: input })
                });

                const data = await response.json();
                isThinking = false;
                
                let debtScore = 0;
                let boundaryType = "Direct Link";
                
                if (data.neo4j_live_graph_debt && data.neo4j_live_graph_debt.epistemic_debt !== undefined) {
                    debtScore = parseFloat(data.neo4j_live_graph_debt.epistemic_debt);
                    if (data.neo4j_live_graph_debt.boundary_type) {
                        boundaryType = data.neo4j_live_graph_debt.boundary_type;
                    }
                }

                // UPDATE UI: Friction Meter
                document.getElementById('debtValue').innerText = debtScore.toFixed(2);
                const meter = document.getElementById('debtMeter');
                meter.style.width = (debtScore * 100) + '%';
                meter.style.backgroundColor = debtScore > 0.7 ? '#ef4444' : (debtScore > 0.4 ? '#d97706' : '#0d9488');

                // UPDATE UI: Graph Path Visualizer
                const pathTrail = document.getElementById('pathTrail');
                pathTrail.innerHTML = `
                    <span class="node-tag">Query</span> 
                    <span>→</span> 
                    <span class="node-tag" style="color:#38bdf8;">${boundaryType}</span> 
                    <span>→</span> 
                    <span class="node-tag" style="color:#fbbf24;">Debt: ${debtScore}</span>
                `;

                // UPDATE 3D PHYSICS
                if (debtScore > 0) {
                    targetDistortion = debtScore; 
                    targetSpin = 0.005 + (debtScore * 0.02); 
                    targetColor = new THREE.Color().lerpColors(new THREE.Color(0x0d9488), new THREE.Color(0xff4400), debtScore);
                } else {
                    targetDistortion = 0;
                    targetSpin = 0.005;
                    targetColor.setHex(0x0d9488);
                }
                
            } catch (error) {
                isThinking = false;
                targetSpin = 0.005;
                targetColor.setHex(0x334155);
                document.getElementById('pathTrail').innerHTML = `<span style="color:#ef4444;">Error connecting to backend telemetry.</span>`;
            }
        }

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });
    </script>
</body>
</html>
