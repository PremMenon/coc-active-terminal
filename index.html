<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conscious of Consciousness | 3D Structural Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body { background-color: #050505; color: #0d9488; font-family: 'Montserrat', sans-serif; overflow: hidden; margin: 0; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        #ui { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(15, 23, 42, 0.9); padding: 24px; border: 1px solid #0d9488; border-radius: 16px; width: 420px; box-shadow: 0 0 25px rgba(13, 148, 136, 0.25); backdrop-filter: blur(10px); }
        input { width: 100%; padding: 12px; margin-bottom: 12px; background: #020617; border: 1px solid #334155; color: #38bdf8; border-radius: 8px; box-sizing: border-box; font-family: 'Montserrat', sans-serif; font-size: 14px; outline: none;}
        input:focus { border-color: #0d9488; box-shadow: 0 0 10px rgba(13, 148, 136, 0.3); }
        button { width: 100%; padding: 12px; background: #0d9488; color: #ffffff; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-family: 'Montserrat', sans-serif; letter-spacing: 1px; text-transform: uppercase; font-size: 13px; transition: background 0.3s;}
        button:hover { background: #0f766e; }
        #output { margin-top: 15px; font-size: 12px; white-space: pre-wrap; word-wrap: break-word; max-height: 320px; overflow-y: auto; color: #cbd5e1; font-family: monospace; background: #020617; padding: 12px; border-radius: 8px; border: 1px solid #1e293b; }
        h2 { font-family: 'Cormorant Garamond', serif; margin: 0 0 4px 0; font-size: 24px; color: #f8fafc; letter-spacing: 1px; }
        .subtitle { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: #94a3b8; margin-bottom: 16px; }
    </style>
</head>
<body>

    <div id="ui">
        <h2>Conscious of Consciousness</h2>
        <div class="subtitle">Live Epistemic Physics Engine</div>
        <input type="text" id="queryInput" placeholder="Enter concept (e.g., Advaita, Maya)..." onkeydown="if(event.key === 'Enter') sendQuery()">
        <button onclick="sendQuery()">Extract Structural Friction</button>
        <div id="output">System Initialized. Awaiting query...</div>
    </div>

    <!-- Three.js 3D Library -->
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script>
        // 1. SCENE SETUP
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        camera.position.z = 25;

        // Lighting matching brand palette
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0xd97706, 2, 50);
        pointLight.position.set(10, 10, 15);
        scene.add(pointLight);

        // 2. PROCEDURAL 3D LOGO ASSEMBLY (Recreating your SVG composite mark in 3D)
        const logoGroup = new THREE.Group();

        // Material definitions
        const tealMaterial = new THREE.MeshStandardMaterial({ color: 0x0d9488, wireframe: false, roughness: 0.3, metalness: 0.2 });
        const goldMaterial = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.2, metalness: 0.5 });
        const wireMaterial = new THREE.MeshBasicMaterial({ color: 0x0d9488, wireframe: true, transparent: true, opacity: 0.3 });

        // Outer Ripple Rings
        const ringGeo1 = new THREE.TorusGeometry(8, 0.08, 16, 100);
        const outerRing = new THREE.Mesh(ringGeo1, wireMaterial);
        logoGroup.add(outerRing);

        const ringGeo2 = new THREE.TorusGeometry(6.5, 0.15, 16, 100);
        const innerRing = new THREE.Mesh(ringGeo2, tealMaterial);
        logoGroup.add(innerRing);

        // Procedural Lotus/Eye Petal Shapes using Three.js Shape Extrusion
        function createPetalShape(width, height) {
            const shape = new THREE.Shape();
            shape.moveTo(0, -height);
            shape.bezierCurveTo(width, -height, width * 1.2, 0, 0, height);
            shape.bezierCurveTo(-width * 1.2, 0, -width, -height, 0, -height);
            return shape;
        }

        const extrudeSettings = { depth: 0.6, bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: 0.1, bevelThickness: 0.1 };
        
        // Outer Leaf
        const outerPetalGeo = new THREE.ExtrudeGeometry(createPetalShape(3.5, 5.5), extrudeSettings);
        const outerPetal = new THREE.Mesh(outerPetalGeo, tealMaterial);
        outerPetal.position.z = -0.3;
        logoGroup.add(outerPetal);

        // Inner Golden Lotus Petal
        const innerPetalGeo = new THREE.ExtrudeGeometry(createPetalShape(2.2, 3.8), extrudeSettings);
        const innerPetal = new THREE.Mesh(innerPetalGeo, goldMaterial);
        innerPetal.position.z = 0;
        logoGroup.add(innerPetal);

        // Center Spark Core
        const coreGeo = new THREE.SphereGeometry(0.8, 32, 32);
        const coreMesh = new THREE.Mesh(coreGeo, goldMaterial);
        coreMesh.position.set(0, 0.3, 0.4);
        logoGroup.add(coreMesh);

        scene.add(logoGroup);
        logoGroup.position.x = 4; // Shift right so UI box sits neatly on the left

        // 3. ANIMATION & PHYSICS VARIABLES
        let currentSpin = 0.005;
        let targetSpin = 0.005;
        let targetDistortion = 0;
        let targetColor = new THREE.Color(0x0d9488);
        let isThinking = false;

        function animate() {
            requestAnimationFrame(animate);
            
            currentSpin += (targetSpin - currentSpin) * 0.05;
            logoGroup.rotation.y += currentSpin;
            logoGroup.rotation.x = Math.sin(Date.now() * 0.001) * 0.1;

            // Dynamically morph scale based on Neo4j debt score
            if (isThinking) {
                logoGroup.scale.setScalar(1 + Math.sin(Date.now() * 0.015) * 0.15);
            } else {
                const time = Date.now() * 0.004;
                logoGroup.scale.x = 1 + Math.sin(time) * (targetDistortion * 0.5);
                logoGroup.scale.y = 1 + Math.cos(time * 1.3) * (targetDistortion * 0.5);
                logoGroup.scale.z = 1 + Math.sin(time * 0.9) * (targetDistortion * 0.5);
            }

            // Smooth color transition across materials
            tealMaterial.color.lerp(targetColor, 0.05);

            renderer.render(scene, camera);
        }
        animate();

        // 4. BACKEND CONNECTION (Neo4j / Cloudflare API)
        async function sendQuery() {
            const input = document.getElementById('queryInput').value;
            const outputDiv = document.getElementById('output');
            if (!input) return;

            outputDiv.innerHTML = `<span style="color:#38bdf8;">> ${input}</span>\nQuerying graph database...`;
            isThinking = true;
            targetSpin = 0.04;
            targetColor.setHex(0xd97706); // Switch to gold alert state

            try {
                const response = await fetch("https://writers-dictionaries-tanks-protest.trycloudflare.com/extract", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ user_query: input })
                });

                const data = await response.json();
                outputDiv.innerHTML = `<span style="color:#38bdf8;">> ${input}</span>\n\n` + JSON.stringify(data, null, 2);
                isThinking = false;
                
                let debtScore = 0;
                if (data.neo4j_live_graph_debt && data.neo4j_live_graph_debt.epistemic_debt !== undefined) {
                    debtScore = parseFloat(data.neo4j_live_graph_debt.epistemic_debt);
                }

                if (debtScore > 0) {
                    targetDistortion = debtScore; 
                    targetSpin = 0.005 + (debtScore * 0.02); 
                    // Shift color from Awakening Teal to Volatile Red/Orange based on graph tension
                    targetColor = new THREE.Color().lerpColors(new THREE.Color(0x0d9488), new THREE.Color(0xef4444), debtScore);
                } else {
                    targetDistortion = 0;
                    targetSpin = 0.005;
                    targetColor.setHex(0x0d9488);
                }
                
            } catch (error) {
                outputDiv.innerHTML = `<span style="color:#ef4444;">CONNECTION ERROR</span>\n\nDetails: ${error.message}`;
                isThinking = false;
                targetSpin = 0.005;
                targetColor.setHex(0x334155);
            }
        }

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });
    </script>
</body>
</html>
