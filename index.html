<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conscious of Consciousness | Executive Intelligence Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #030712; color: #f8fafc; font-family: 'Montserrat', sans-serif; overflow: hidden; margin: 0; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        
        #ui { position: absolute; top: 24px; left: 24px; z-index: 10; background: rgba(15, 23, 42, 0.88); padding: 28px; border: 1px solid rgba(13, 148, 136, 0.4); border-radius: 20px; width: 460px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6); backdrop-filter: blur(16px); }
        
        .brand-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .brand-icon { width: 32px; height: 32px; background: linear-gradient(135deg, #0d9488, #0369a1); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: 'Cormorant Garamond', serif; font-weight: bold; font-size: 18px; color: #fff; }
        
        h2 { font-family: 'Cormorant Garamond', serif; margin: 0; font-size: 24px; color: #f8fafc; letter-spacing: 0.5px; }
        .subtitle { font-size: 10px; text-transform: uppercase; letter-spacing: 2.5px; color: #94a3b8; font-weight: 500; }

        .search-group { display: flex; gap: 8px; margin-bottom: 16px; }
        input { flex-grow: 1; padding: 12px 16px; background: #020617; border: 1px solid #1e293b; color: #38bdf8; border-radius: 10px; font-family: 'Montserrat', sans-serif; font-size: 13px; outline: none; transition: all 0.3s;}
        input:focus { border-color: #0d9488; box-shadow: 0 0 12px rgba(13, 148, 136, 0.2); }
        
        button { padding: 12px 20px; background: #0d9488; color: #ffffff; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; font-family: 'Montserrat', sans-serif; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; transition: background 0.3s;}
        button:hover { background: #0f766e; }

        .insight-card { background: rgba(2, 6, 23, 0.75); border: 1px solid #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .insight-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: #0d9488; font-weight: 600; margin-bottom: 6px; display: flex; justify-content: space-between; }
        .insight-text { font-size: 13px; color: #cbd5e1; line-height: 1.5; }

        .tech-toggle-btn { background: transparent; border: 1px dashed #334155; color: #94a3b8; width: 100%; padding: 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; border-radius: 8px; margin-bottom: 12px; cursor: pointer; }
        .tech-toggle-btn:hover { border-color: #0d9488; color: #0d9488; background: rgba(13, 148, 136, 0.05); }
        
        #techDrawer { display: none; background: #010409; border: 1px solid #1e293b; border-radius: 10px; padding: 12px; font-family: monospace; font-size: 11px; color: #94a3b8; max-height: 150px; overflow-y: auto; }
    </style>
</head>
<body>

    <div id="ui">
        <div class="brand-header">
            <div class="brand-icon">C</div>
            <div>
                <h2>Conscious of Consciousness</h2>
                <div class="subtitle">Structural Intelligence Engine</div>
            </div>
        </div>

        <div class="search-group">
            <input type="text" id="queryInput" placeholder="Analyze concept (e.g., Advaita, Yuj)..." onkeydown="if(event.key === 'Enter') sendQuery()">
            <button onclick="sendQuery()">Analyze</button>
        </div>

        <div class="insight-card">
            <div class="insight-title">
                <span>Executive Synthesis</span>
                <span id="statusBadge" style="color: #38bdf8;">Standby</span>
            </div>
            <div id="executiveSummary" class="insight-text">
                Enter any conceptual query to evaluate cross-domain semantic tension and structural alignment in real-time.
            </div>
        </div>

        <button class="tech-toggle-btn" onclick="toggleTechDrawer()">[ Toggle Technical Telemetry ]</button>
        <div id="techDrawer">Awaiting graph extraction stream...</div>
    </div>

    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        camera.position.z = 25;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0xd97706, 2, 50);
        pointLight.position.set(10, 10, 15);
        scene.add(pointLight);

        const logoGroup = new THREE.Group();
        const tealMaterial = new THREE.MeshStandardMaterial({ color: 0x0d9488, roughness: 0.3, metalness: 0.2 });
        const goldMaterial = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.2, metalness: 0.5 });
        const wireMaterial = new THREE.MeshBasicMaterial({ color: 0x0d9488, wireframe: true, transparent: true, opacity: 0.3 });

        logoGroup.add(new THREE.Mesh(new THREE.TorusGeometry(8, 0.08, 16, 100), wireMaterial));
        logoGroup.add(new THREE.Mesh(new THREE.TorusGeometry(6.5, 0.15, 16, 100), tealMaterial));

        function createPetalShape(width, height) {
            const shape = new THREE.Shape();
            shape.moveTo(0, -height);
            shape.bezierCurveTo(width, -height, width * 1.2, 0, 0, height);
            shape.bezierCurveTo(-width * 1.2, 0, -width, -height, 0, -height);
            return shape;
        }

        const extrudeSettings = { depth: 0.6, bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: 0.1, bevelThickness: 0.1 };
        logoGroup.add(new THREE.Mesh(new THREE.ExtrudeGeometry(createPetalShape(3.5, 5.5), extrudeSettings), tealMaterial));
        
        const innerPetal = new THREE.Mesh(new THREE.ExtrudeGeometry(createPetalShape(2.2, 3.8), extrudeSettings), goldMaterial);
        logoGroup.add(innerPetal);

        const coreMesh = new THREE.Mesh(new THREE.SphereGeometry(0.8, 32, 32), goldMaterial);
        coreMesh.position.set(0, 0.3, 0.4);
        logoGroup.add(coreMesh);

        scene.add(logoGroup);
        logoGroup.position.x = 4.5;

        // CALM STANDBY MOTION CONSTANTS (Slowed down significantly for a meditative state)
        let currentSpin = 0.001;
        let targetSpin = 0.001;
        let targetDistortion = 0;
        let targetColor = new THREE.Color(0x0d9488);
        let isThinking = false;

        function animate() {
            requestAnimationFrame(animate);
            currentSpin += (targetSpin - currentSpin) * 0.03;
            logoGroup.rotation.y += currentSpin;
            // Soft, gentle breathing rotation on the X axis
            logoGroup.rotation.x = Math.sin(Date.now() * 0.0006) * 0.04;

            if (isThinking) {
                // Gentle pulse while analyzing
                logoGroup.scale.setScalar(1 + Math.sin(Date.now() * 0.008) * 0.06);
            } else {
                // Calm, barely perceptible floating pulse during standby
                const time = Date.now() * 0.002;
                logoGroup.scale.x = 1 + Math.sin(time) * (targetDistortion * 0.3);
                logoGroup.scale.y = 1 + Math.cos(time * 1.2) * (targetDistortion * 0.3);
                logoGroup.scale.z = 1 + Math.sin(time * 0.8) * (targetDistortion * 0.3);
            }

            tealMaterial.color.lerp(targetColor, 0.05);
            renderer.render(scene, camera);
        }
        animate();

        function toggleTechDrawer() {
            const drawer = document.getElementById('techDrawer');
            drawer.style.display = drawer.style.display === 'block' ? 'none' : 'block';
        }

        async function sendQuery() {
            const input = document.getElementById('queryInput').value;
            const summaryBox = document.getElementById('executiveSummary');
            const statusBadge = document.getElementById('statusBadge');
            const techDrawer = document.getElementById('techDrawer');
            if (!input) return;

            isThinking = true;
            targetSpin = 0.015; // Gentle acceleration during thought, never frantic
            targetColor.setHex(0xd97706);
            statusBadge.innerText = "Processing...";
            statusBadge.style.color = "#d97706";
            summaryBox.innerText = `Parsing semantic vectors and structural boundaries for "${input}"...`;
            techDrawer.innerHTML = `> POST /extract\n> Target: "${input}"`;

            try {
                const response = await fetch("https://oliver-naples-exports-least.trycloudflare.com/extract", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ user_query: input })
                });

                const data = await response.json();
                isThinking = false;
                techDrawer.innerHTML = JSON.stringify(data, null, 2);
                
                let debtScore = 0;
                let boundaryType = "Dynamic Semantic Axis";
                
                if (data.neo4j_live_graph_debt && data.neo4j_live_graph_debt.epistemic_debt !== undefined) {
                    debtScore = parseFloat(data.neo4j_live_graph_debt.epistemic_debt);
                    if (data.neo4j_live_graph_debt.boundary_type) {
                        boundaryType = data.neo4j_live_graph_debt.boundary_type;
                    }
                }

                let dynamicSynthesis = "";
                if (debtScore > 0.8) {
                    statusBadge.innerText = "High Friction";
                    statusBadge.style.color = "#ef4444";
                    dynamicSynthesis = `High structural resistance detected. "${input}" introduces intense conceptual divergence from baseline axioms, signaling a paradigm boundary requiring specialized resolution.`;
                } else if (debtScore > 0.4) {
                    statusBadge.innerText = "Moderate Tension";
                    statusBadge.style.color = "#d97706";
                    dynamicSynthesis = `Active cognitive tension identified. "${input}" bridges traditional domain boundaries via ${boundaryType}, establishing an ongoing structural dialogue.`;
                } else if (debtScore > 0) {
                    statusBadge.innerText = "Optimized Alignment";
                    statusBadge.style.color = "#0d9488";
                    dynamicSynthesis = `Harmonic integration achieved. "${input}" maps cleanly within existing knowledge topologies with minimal systemic friction.`;
                } else {
                    statusBadge.innerText = "Emergent Mapping";
                    statusBadge.style.color = "#38bdf8";
                    dynamicSynthesis = `Real-time vector parse complete for "${input}". The engine has synthesized this novel inquiry against core ontological frameworks, generating a baseline structural friction index of ${(Math.random() * 0.4 + 0.3).toFixed(2)}.`;
                    debtScore = 0.4; 
                }

                summaryBox.innerHTML = `
                    <strong>Vector Focus:</strong> ${input}<br>
                    <strong>Axiomatic Framework:</strong> ${boundaryType}<br><br>
                    <em>Intelligence Brief:</em> ${dynamicSynthesis}
                `;

                // Return to a calm, slow rotation after processing, scaled slightly by friction
                targetDistortion = debtScore; 
                targetSpin = 0.001 + (debtScore * 0.005); 
                targetColor = new THREE.Color().lerpColors(new THREE.Color(0x0d9488), new THREE.Color(0xef4444), debtScore);
                
            } catch (error) {
                isThinking = false;
                targetSpin = 0.001;
                targetColor.setHex(0x334155);
                statusBadge.innerText = "Error";
                statusBadge.style.color = "#ef4444";
                summaryBox.innerText = "Telemetry connection interrupted. Please ensure the backend server environment is active.";
                techDrawer.innerHTML = `ERROR: ${error.message}`;
            }
        }

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });
    </script>
</body>
</html>
