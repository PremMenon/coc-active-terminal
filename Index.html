<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Conscious of Consciousness | Live Structural Friction</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; color: #00ffcc; font-family: monospace; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        #ui { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(0,0,0,0.85); padding: 20px; border: 1px solid #00ffcc; border-radius: 8px; width: 450px; box-shadow: 0 0 15px rgba(0, 255, 204, 0.2); }
        input { width: 100%; padding: 10px; margin-bottom: 10px; background: #111; border: 1px solid #00ffcc; color: #00ffcc; box-sizing: border-box; font-family: monospace; font-size: 14px;}
        button { width: 100%; padding: 10px; background: #00ffcc; color: #000; border: none; cursor: pointer; font-weight: bold; font-family: monospace; text-transform: uppercase; font-size: 14px;}
        button:hover { background: #00ccaa; }
        #output { margin-top: 15px; font-size: 12px; white-space: pre-wrap; word-wrap: break-word; max-height: 400px; overflow-y: auto; color: #e2e8f0; }
        h2 { margin-top: 0; font-size: 18px; letter-spacing: 2px; color: #00ffcc;}
    </style>
</head>
<body>

<div id="ui">
    <h2>CoC | ACTIVE TERMINAL</h2>
    <p style="font-size: 12px; margin-bottom: 15px; color: #888;">System Online. Epistemic Debt physics initialized. Awaiting input.</p>
    <input type="text" id="queryInput" placeholder="Enter concept (e.g., Maya, time)..." onkeydown="if(event.key === 'Enter') sendQuery()">
    <button onclick="sendQuery()">Extract Epistemic Debt</button>
    <div id="output"></div>
</div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const geometry = new THREE.TorusKnotGeometry(10, 2.5, 128, 16);
    const material = new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true });
    const cocLogo = new THREE.Mesh(geometry, material);
    scene.add(cocLogo);

    cocLogo.position.x = 8;
    camera.position.z = 30;

    let currentSpinSpeed = 0.002;
    let targetSpinSpeed = 0.002;
    let targetDistortion = 0; 
    let targetColor = new THREE.Color(0x00ffcc);
    let isThinking = false;

    function animate() {
        requestAnimationFrame(animate);
        
        currentSpinSpeed += (targetSpinSpeed - currentSpinSpeed) * 0.05;
        material.color.lerp(targetColor, 0.05);

        cocLogo.rotation.x += currentSpinSpeed;
        cocLogo.rotation.y += currentSpinSpeed;
        
        if (isThinking) {
            cocLogo.scale.setScalar(1 + Math.sin(Date.now() * 0.01) * 0.15);
        } else {
            const time = Date.now() * 0.005;
            cocLogo.scale.x = 1 + Math.sin(time) * (targetDistortion * 0.6);
            cocLogo.scale.y = 1 + Math.cos(time * 1.2) * (targetDistortion * 0.6);
            cocLogo.scale.z = 1 + Math.sin(time * 0.8) * (targetDistortion * 0.6);
        }

        renderer.render(scene, camera);
    }
    animate();

    async function sendQuery() {
        const input = document.getElementById('queryInput').value;
        const outputDiv = document.getElementById('output');
        if (!input) return;

        outputDiv.innerHTML = "<span style='color:#00ffcc;'>> " + input + "</span>\nMapping structural boundaries...";
        
        isThinking = true;
        targetSpinSpeed = 0.05; 
        targetColor.setHex(0xff0055); 

        try {
            const response = await fetch("https://writers-dictionaries-tanks-protest.trycloudflare.com/extract", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ user_query: input })
            });

            const data = await response.json();
            outputDiv.innerHTML = "<span style='color:#00ffcc;'>> " + input + "</span>\n\n" + JSON.stringify(data, null, 2);
            isThinking = false;
            
            let debtScore = 0;
            if (data.neo4j_live_graph_debt && data.neo4j_live_graph_debt.epistemic_debt !== undefined) {
                debtScore = parseFloat(data.neo4j_live_graph_debt.epistemic_debt);
            }

            if (debtScore > 0) {
                targetDistortion = debtScore; 
                targetSpinSpeed = 0.002 + (debtScore * 0.03); 
                targetColor = new THREE.Color().lerpColors(new THREE.Color(0x00ffcc), new THREE.Color(0xff4400), debtScore);
            } else {
                targetDistortion = 0;
                targetSpinSpeed = 0.002;
                targetColor.setHex(0x00ffcc);
            }
            
        } catch (error) {
            outputDiv.innerHTML = "<span style='color:#ff0055;'>CRITICAL ERROR</span>\n\nDetails: " + error.message;
            isThinking = false;
            targetSpinSpeed = 0.000;
            targetColor.setHex(0x333333); 
        }
    }

    window.addEventListener('resize', () => {
        renderer.setSize(window.innerWidth, window.innerHeight);
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
    });
</script>
</body>
</html>
